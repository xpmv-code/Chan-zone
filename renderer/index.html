<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Chan zone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@200;300;400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <!-- ── Title Bar ── -->
  <div class="titlebar">
    <span class="brand">
      <svg class="brand-mark" width="22" height="12" viewBox="0 0 44 24" fill="none" aria-hidden="true">
        <path d="M5 8 Q13 2 21 8 T39 8" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/>
        <path d="M9 15 Q15 10 21 15 T35 15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
      <span>Chan zone</span>
    </span>
    <div class="titlebar-right">
      <button class="icon-btn" id="btn-theme" title="黑夜模式">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-pin" title="钉在最上层">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 17v5"/>
          <path d="M9 3v6l-4 4h14l-4-4V3"/>
          <line x1="12" y1="3" x2="12" y2="6"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-compact" title="极简模式">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3v3a2 2 0 0 1-2 2H3"/>
          <path d="M21 8h-3a2 2 0 0 1-2-2V3"/>
          <path d="M3 16h3a2 2 0 0 1 2 2v3"/>
          <path d="M16 21v-3a2 2 0 0 1 2-2h3"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-fullscreen" title="全屏显示">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
          <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
          <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
          <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
        </svg>
      </button>
      <button class="icon-btn" id="btn-settings" title="设置">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
      </button>
      <button class="win-btn btn-min"   id="btn-min"   title="最小化"></button>
      <button class="win-btn btn-close" id="btn-close" title="隐藏"></button>
    </div>
  </div>

  <!-- ── Task ── -->
  <div class="task-area">
    <input class="task-input" id="task-input" type="text"
           value="专注工作" placeholder="输入工作事项…" maxlength="28" spellcheck="false">
    <div class="task-chips" id="task-chips">
      <button type="button" class="chip" data-full="行测 · 言语理解">言语理解</button>
      <button type="button" class="chip" data-full="行测 · 判断推理">判断推理</button>
      <button type="button" class="chip" data-full="行测 · 资料分析">资料分析</button>
      <button type="button" class="chip" data-full="行测 · 数量关系">数量关系</button>
      <button type="button" class="chip" data-full="行测 · 常识判断">常识判断</button>
      <button type="button" class="chip" data-full="申论 · 归纳概括">申论概括</button>
      <button type="button" class="chip" data-full="申论 · 综合分析">申论分析</button>
      <button type="button" class="chip" data-full="申论 · 提出对策">申论对策</button>
      <button type="button" class="chip" data-full="申论 · 大作文">申论作文</button>
      <button type="button" class="chip" data-full="时政 · 每日积累">时政积累</button>
      <button type="button" class="chip" data-full="面试 · 真题演练">面试演练</button>
      <button type="button" class="chip" data-full="真题 · 整套模考">真题模考</button>
    </div>
  </div>

  <!-- ── Mode Tabs ── -->
  <div class="mode-tabs">
    <button class="mode-btn active" data-mode="focus">专注</button>
    <button class="mode-btn" data-mode="short">小憩</button>
    <button class="mode-btn" data-mode="long">长休</button>
    <button class="mode-btn" data-mode="stopwatch">正计时</button>
    <button class="mode-btn" data-mode="countdown">倒计时</button>
  </div>

  <!-- ── Clock ── -->
  <div class="clock-face">
    <svg class="clock-svg" viewBox="0 0 220 220">
      <!-- Enso ring: real progress ring (counter-clockwise, starts at 12 o'clock) -->
      <!-- r=97, circumference≈609.47；无滤镜，保证边缘平滑无锯齿 -->
      <path class="enso" id="enso-progress"
            d="M 110 13 A 97 97 0 1 0 110 207 A 97 97 0 1 0 110 13"
            stroke-dasharray="609.47" stroke-dashoffset="0"/>

      <!-- Thin inner track (static) -->
      <circle class="track"    cx="110" cy="110" r="86"/>
    </svg>

    <!-- Inner disc: plain background (no backdrop-filter inside transparent window) -->
    <div class="clock-inner"></div>

    <div class="time-display">
      <div class="time-num" id="time-display">25:00</div>
      <div class="session-label" id="session-label">第 1 轮</div>
    </div>
  </div>

  <!-- ── Duration (focus & countdown only) ── -->
  <div class="duration-row" id="duration-row">
    <span class="dur-label">时长</span>
    <input class="dur-input" id="dur-input" type="number" min="1" max="120" value="25">
    <span class="dur-unit">分钟</span>
  </div>

  <!-- ── Controls ── -->
  <div class="controls">
    <button class="ctrl-btn" id="btn-reset" title="重置">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
      </svg>
    </button>

    <button class="ctrl-btn play-btn" id="btn-play" aria-label="开始/暂停">
      <svg id="play-svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="6,3 20,12 6,21"/>
      </svg>
    </button>

    <button class="ctrl-btn" id="btn-skip" title="跳过">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
        <polygon points="5,4 15,12 5,20"/>
        <rect x="17" y="4" width="2.5" height="16" rx="1"/>
      </svg>
    </button>
  </div>

  <!-- ── Save mid-session (shows when paused with elapsed time) ── -->
  <button class="save-btn" id="btn-save-now">
    <svg width="11" height="11" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
      <rect x="3" y="4" width="18" height="18" rx="2"/>
      <line x1="16" y1="2" x2="16" y2="6"/>
      <line x1="8"  y1="2" x2="8"  y2="6"/>
      <line x1="3"  y1="10" x2="21" y2="10"/>
    </svg>
    <span>记录此段到日历</span>
  </button>

  <!-- ── Session Dots ── -->
  <div class="dots" id="dots">
    <div class="dot current" id="d0"></div>
    <div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div>
    <div class="dot" id="d3"></div>
  </div>

  <!-- ── Zen Quote ── -->
  <div class="quote" id="quote">需要的不多，想要的太多。</div>
  <div class="quote-author" id="quote-author">— 圣严法师 · 108自在语</div>

  <!-- ══ Settings Panel ══ -->
  <div class="settings-panel" id="settings-panel">
    <div class="settings-header">
      <span class="settings-title">设置</span>
      <button class="icon-btn" id="btn-settings-close">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="18" y1="6"  x2="6"  y2="18"/>
          <line x1="6"  y1="6"  x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div class="settings-body">

      <div class="setting-group">
        <span class="setting-group-label">计时时长</span>
        <div class="setting-row">
          <span class="setting-row-label">专注</span>
          <input class="setting-input" id="s-focus" type="number" min="1" max="120" value="25">
          <span class="s-unit">分</span>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">小憩</span>
          <input class="setting-input" id="s-short" type="number" min="1" max="30"  value="5">
          <span class="s-unit">分</span>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">长休</span>
          <input class="setting-input" id="s-long"  type="number" min="1" max="60"  value="15">
          <span class="s-unit">分</span>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">倒计时</span>
          <input class="setting-input" id="s-countdown" type="number" min="1" max="999" value="10">
          <span class="s-unit">分</span>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-group-label">音效</span>
        <div class="setting-row">
          <span class="setting-row-label">木鱼 · 引磬</span>
          <select class="setting-select" id="s-sound-enable">
            <option value="1">开启</option>
            <option value="0">关闭</option>
          </select>
        </div>
        <div class="sound-test-row">
          <button class="test-btn" id="btn-test-mokugyo">▶ 木鱼</button>
          <button class="test-btn" id="btn-test-rin">▶ 引磬</button>
        </div>
      </div>

      <div class="setting-group">
        <span class="setting-group-label">苹果日历</span>
        <div class="setting-row">
          <span class="setting-row-label">同步日历</span>
          <select class="setting-select" id="s-cal-enable">
            <option value="1">开启</option>
            <option value="0">关闭</option>
          </select>
        </div>
        <div class="setting-row">
          <span class="setting-row-label">日历名称</span>
          <input class="setting-input" id="s-cal-name" type="text"
                 value="日历" placeholder="日历 / Calendar" spellcheck="false">
        </div>
        <div class="cal-status-bar">
          <div class="cal-indicator" id="cal-dot"></div>
          <span class="cal-status-text" id="cal-status-text">尚未测试连接</span>
          <button class="test-btn" id="btn-test-cal">测试连接</button>
        </div>
      </div>

    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

</div>
<script src="renderer.js"></script>
</body>
</html>
